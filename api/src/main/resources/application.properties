spring.application.name=apiuser

spring.datasource.url=jdbc:h2:file:./data/clinica_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.docker.compose.enabled=false

logging.level.org.springframework.security=DEBUG

app.auth.jwt-secret=${JWT_SECRET:3CUVDibPiD8j8WzRtWwz3zFh0h+zPPy0HtGYzzwqhVc=}
app.auth.jwt-validade-minutos=${JWT_VALIDADE_MINUTOS:60}

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
    